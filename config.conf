# --- INTERFACE CONFIGURATION ---

# Name of the virtual TUN interface. 
# Default is "tun0".
tunname tun0

# Static IP address assigned to the server's TUN interface.
# Only relevant if running in Server Mode.
tunip 10.0.0.1

# Maximum Transmission Unit (MTU) for the TUN device.
# 1400 is recommended to provide headroom for VPN/UDP headers.
mtu 1400

# Suppress IPv6 stack on the TUN interface.
# Use 'yes' to prevent ghost traffic/neighbor discovery errors.
disable-ipv6 yes


# --- NETWORK & SOCKET CONFIGURATION ---

# The local UDP port the server will bind to and listen on.
# Also used by the client as the default destination port.
port 9999

# Remote server IP address or hostname.
# This is used by the client to establish the tunnel connection.
remote-host 192.168.211.130

# UDP receive buffer size (SO_RCVBUF) in Megabytes (MB).
# High values help prevent packet drops during traffic bursts.
udp-backlog 20


# --- IO_URING & MEMORY POOL ---

# Submission Queue (SQ) depth for the io_uring instance.
# Must be a power of two (e.g., 512, 1024, 2048).
io-ring-depth 1024

# Total number of pre-allocated buffers in the I/O pool.
# Increasing this allows for more concurrent packets in flight.
io-pool-size 2048


# --- IPAM (IP Address Management) ---

# The start of the virtual IP range for client allocation.
pool-network 10.0.0.0

# Total capacity of the IP address pool (e.g., 65536 for a /16).
pool-size 65536


# --- SYSTEM BEHAVIOR ---

# Run the process in the background as a daemon.
# Use 'yes' for background execution, 'no' for interactive/debug mode.
daemonize no

# Specify the log file name. 
# Leave empty to log to standard output (STDOUT).
#logfile /var/log/vfast.log

# Set the maximum size of a single log file in Megabytes (MB).
# When exceeded, the log will rotate. Default is 100.
log-max-size 100

# Specify the log file name. Also the empty string can be used to force
# to log on the standard output. Note that if you use standard
# output for logging but daemonize, logs will be sent to /dev/null
#logfile /home/yrb/vfast.log

# If a pid file is specified, sandtable writes it where specified at startup
# and removes it at exit.
#
# When the server runs non daemonized, no pid file is created if none is
# specified in the configuration. When the server is daemonized, the pid file
# is used even if not specified, defaulting to "/var/run/vfast.pid".
#
# Creating a pid file is best effort: if sandtable is not able to create it
# nothing bad happens, the server will start and run normally.
#pidfile /var/run/vfast.pid