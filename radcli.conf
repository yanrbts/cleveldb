# --- radcli.conf ---

# 认证服务器配置 (格式: 服务器名或IP:端口)
# 默认端口 1812
authserver          127.0.0.1:1812

# 计费服务器配置 (如果你以后要统计流量，默认端口 1813)
acctserver          127.0.0.1:1813

# 共享密钥文件路径 (存储服务器和密钥的对应关系)
servers             /etc/radcli/servers

# 字典文件路径 (定义了 RADIUS 属性，如 User-Name, Password 等)
# 在 Ubuntu 上安装 libradcli-dev 后，通常在这个路径
dictionary          /usr/share/radcli/dictionary

# 重试机制配置
radius_retries      3
radius_timeout      5

# 本地绑定地址 (可选，如果你的服务器有多个 IP)
# bindaddr          *

# 传输协议 (默认为 udp，radcli 也支持 tcp 或 tls)
nas_identifier      vfast_gateway_01